name: test

on:
  push:
  pull_request:

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Require bash >= 5.2 (for ${PS1@P})
        run: |
          bash --version | head -1
          [[ "${BASH_VERSINFO[0]}${BASH_VERSINFO[1]}" -ge 52 ]]
        shell: bash
      - name: Run tests
        run: bats test/
